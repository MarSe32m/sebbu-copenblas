name: CI

"on":
  push:
  pull_request:
  schedule:
  - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.os }}, Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
        swift: ['6.3.2', '6.4.0']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Run (debug)
        run: swift run

      - name: Build (release)
        run: swift build -c release

      - name: Run (release)
        run: swift run -c release

  static-linux:
    name: Static Linux (${{ matrix.sdk }}, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['x86_64-swift-linux-musl', 'aarch64-swift-linux-musl']
        swift: ['6.3.2', '6.4.0']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Swift and Static Linux SDK
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}
          sdks: static-linux

      - name: Show Swift version and installed SDKs
        run: |
          swift --version
          swift sdk list

      - name: Build with Static Linux SDK (debug)
        run: swift build --swift-sdk ${{ matrix.sdk }}

      - name: Build with Static Linux SDK (release)
        run: swift build -c release --swift-sdk ${{ matrix.sdk }}
